name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: aftman install
      - run: stylua --check src examples tooling
      - run: npm run check
